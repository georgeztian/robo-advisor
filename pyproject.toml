[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-advisor"
version = "0.1.0"
description = "Goal-based robo-advisor: risk profiling, category-based ETF selection, portfolio optimization, Monte Carlo planning and S&P 500 comparison, orchestrated as an agent graph with an independent reviewer."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "networkx>=3.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
yahoo = ["yfinance[repair]>=0.2.40"]   # [repair] adds scipy + scikit-learn for price repair
dev = ["pytest>=7"]

[project.scripts]
robo-advisor = "robo_advisor.cli:main"

[tool.setuptools.packages.find]
include = ["robo_advisor*"]

[tool.setuptools.package-data]
robo_advisor = ["config/*.yaml", "report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
